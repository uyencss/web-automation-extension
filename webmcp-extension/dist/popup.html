<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebMCP Control</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 300px;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 12px;
      background-color: #18181b;
      color: #f4f4f5;
      user-select: none;
    }
    .section {
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #27272a;
    }
    .section:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .title-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .app-title {
      font-weight: 600;
      font-size: 13px;
      color: #fafafa;
    }
    .app-version {
      font-size: 10px;
      color: #71717a;
    }
    .status-badge {
      font-size: 10px;
      font-weight: 500;
      padding: 2px 6px;
      border-radius: 9999px;
      background: #27272a;
    }
    .status-open { color: #4ade80; }
    .status-connecting { color: #facc15; }
    .status-closed { color: #f87171; }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-top: 6px;
    }
    .label {
      color: #a1a1aa;
      font-size: 11px;
    }
    .val {
      color: #e4e4e7;
      font-family: monospace;
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    input[type="text"] {
      width: 100%;
      background: #27272a;
      border: 1px solid #3f3f46;
      border-radius: 4px;
      color: #fafafa;
      padding: 6px 8px;
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="text"]:focus {
      border-color: #3b82f6;
    }
    button {
      background: #27272a;
      color: #e4e4e7;
      border: 1px solid #3f3f46;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.15s, border-color 0.15s;
    }
    button:hover {
      background: #3f3f46;
      border-color: #52525b;
    }
    button.primary {
      background: #2563eb;
      border-color: #3b82f6;
      color: #ffffff;
      font-weight: 500;
    }
    button.primary:hover {
      background: #1d4ed8;
    }
    button.danger {
      background: #7f1d1d;
      border-color: #991b1b;
      color: #fca5a5;
    }
    button.danger:hover {
      background: #991b1b;
    }
    .notice {
      margin-top: 6px;
      font-size: 11px;
      color: #facc15;
      display: none;
      line-height: 1.3;
    }
    .actions {
      display: flex;
      gap: 6px;
      margin-top: 6px;
      justify-content: flex-end;
    }
    .subtext {
      font-size: 10px;
      color: #71717a;
      margin-top: 2px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <!-- Header: Gateway Status -->
  <div class="section">
    <div class="header">
      <div class="title-row">
        <span class="app-title">WebMCP Control</span>
        <span class="app-version" id="appVersion">v2.1.13</span>
      </div>
      <div style="display: flex; align-items: center; gap: 6px;">
        <span id="wsStatus" class="status-badge status-closed">🔴 Disconnected</span>
        <button id="btnReconnect" title="Reconnect WebSocket">Reconnect</button>
      </div>
    </div>
  </div>

  <!-- Rename Tab (Primary Area) -->
  <div class="section">
    <div class="row">
      <span class="label" id="tabLabel">Tab: Active</span>
      <button id="btnCopyJson" title="Copy tab JSON for agent commands">📋 Copy JSON</button>
    </div>
    <div style="margin-top: 6px;">
      <input type="text" id="titleInput" placeholder="Enter custom tab title..." autocomplete="off" />
    </div>
    <div id="renameNotice" class="notice"></div>
    <div class="actions">
      <button id="btnResetTitle">Reset</button>
      <button id="btnSaveTitle" class="primary">Save</button>
    </div>
  </div>

  <!-- Profile Identity -->
  <div class="section">
    <div class="row">
      <span class="label">Profile Identity</span>
      <span class="val" id="profileEmailVal">local</span>
    </div>
    <div class="subtext" id="profileIdVal">id: ...</div>
    <div class="row" style="margin-top: 6px;">
      <input type="text" id="profileNameInput" placeholder="Profile name..." style="flex: 1;" />
      <button id="btnSaveProfile">Save</button>
    </div>
  </div>

  <!-- CDP Debugger -->
  <div class="section">
    <div class="row">
      <span class="label">CDP Debugger</span>
      <span class="val" id="cdpStatusVal">Idle</span>
    </div>
    <div class="row">
      <span class="label">Attached Tabs: <span id="attachedCountVal" class="val">0</span></span>
      <div style="display: flex; gap: 4px;">
        <button id="btnDetachTab">Detach Tab</button>
        <button id="btnDetachAll" class="danger">Detach All</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
